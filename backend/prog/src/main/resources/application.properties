spring.application.name=repolens

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/repolens}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.ai.model.chat=google-genai

spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.project-id=${GOOGLE_CLOUD_PROJECT_ID}
spring.ai.google.genai.location=${GOOGLE_CLOUD_LOCATION:us-central1}

spring.ai.google.genai.chat.model=gemini-3.5-flash-lite

spring.ai.model.embedding.text=google-genai

spring.ai.google.genai.embedding.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.embedding.project-id=${GOOGLE_CLOUD_PROJECT_ID}
spring.ai.google.genai.embedding.location=${GOOGLE_CLOUD_LOCATION:us-central1}
spring.ai.google.genai.embedding.text.model=gemini-embedding-001
spring.ai.google.genai.embedding.text.dimensions=768
spring.ai.google.genai.embedding.text.auto-truncate=true

spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.dimensions=768
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE

spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:Ov23liuM795YDTYxqRK3}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:e615ad359cdd60665809929eb89a0bf1eefbf18b}
spring.security.oauth2.client.registration.github.scope=read:user,repo
spring.security.oauth2.client.provider.github.user-name-attribute=id

server.servlet.session.cookie.name=REPOLENS_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=7d

app.frontend-url=${FRONTEND_URL:http://localhost:3000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
app.token-encryptor-password=${TOKEN_ENCRYPTOR_PASSWORD:repolens-local-encrypt-key-change-me}
app.token-encryptor-salt=${TOKEN_ENCRYPTOR_SALT:deadbeefcafebabe}

app.indexing.max-file-bytes=10240000
app.indexing.chunk-size=800
app.indexing.chunk-overlap=100
app.github.api-delay-ms=50